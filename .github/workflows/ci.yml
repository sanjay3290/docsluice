name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/docsluice/dist
          retention-days: 3

  dist-node:
    name: Built package on Node ${{ matrix.node }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice/dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --test packages/docsluice/test-dist/smoke.test.mjs
      - run: node packages/docsluice/test-runtime/run.mjs

  dist-bun:
    name: Built package on Bun
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run packages/docsluice/test-runtime/run.mjs

  dist-deno:
    name: Built package on Deno
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read=. packages/docsluice/test-runtime/run.mjs
