name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Line coverage per file (QA-5); fails below a threshold and writes the job summary.
      - run: npm run coverage
      - run: npm run test:runtime-tools
      - run: npm run build
      - run: npm run check:package
      # The docs site and API reference build (ADR 0013, #78); broken links fail the job.
      - run: npm run docs:site
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          # The built package: dist/ and the generated JSON Schema at the package root (MOD-2).
          path: |
            packages/docsluice/dist
            packages/docsluice/schema.json
          if-no-files-found: error
          retention-days: 3

  dist-node:
    name: Built package on Node ${{ matrix.node }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --omit=dev --ignore-scripts
      - run: node --test packages/docsluice/test-dist/smoke.test.mjs
      - run: node packages/docsluice/test-runtime/run.mjs

  dist-bun:
    name: Built package on Bun
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run packages/docsluice/test-runtime/run.mjs

  dist-deno:
    name: Built package on Deno
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read=. packages/docsluice/test-runtime/run.mjs

  dist-browser:
    name: Built package in Chromium, Firefox and WebKit
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  dist-workers:
    name: Built package on Cloudflare Workers (local workerd)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages/docsluice
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      # Wrangler's esbuild and workerd carry install scripts, so it is installed outside the workspace,
      # pinned and with scripts off, instead of as a repository dev dependency (ADR 0011).
      - run: npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund wrangler@4.146.0
      - run: node scripts/run-workers-runtime.mjs
        env:
          DOCSLUICE_WRANGLER_BIN: ${{ runner.temp }}/wrangler/node_modules/.bin/wrangler
