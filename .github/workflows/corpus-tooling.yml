name: Corpus tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/corpus/build.test.mjs
