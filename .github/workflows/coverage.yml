name: Coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage gates (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test/coverage-summary.test.mjs
      - run: npm run coverage --workspace docsluice
      - name: Add coverage report to job summary
        if: always()
        run: node scripts/coverage-summary.mjs
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/docsluice/coverage
          if-no-files-found: ignore
          retention-days: 3
