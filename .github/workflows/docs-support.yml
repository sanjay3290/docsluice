name: Documentation support matrix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  support-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/test/docs-support.test.mjs
      - run: node scripts/docs-support.mjs --check
