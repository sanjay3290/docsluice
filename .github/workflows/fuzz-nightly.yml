name: Fuzz (nightly)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }} (30m)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            zip,
            image,
            media,
            xml,
            detect,
            detection,
            ole,
            txt,
            markdown,
            csv,
            json,
            text-families,
            latex,
            xml-reader,
            html,
            doc,
            listed-archives,
            ppt,
            ooxml,
            office-encryption,
            docx,
            vsdx,
            xlsx,
            xlsx-numfmt,
            pptx,
            zip-container,
            mime,
            eml,
            mbox,
            msg,
            ods,
            odp,
            odf,
            odt,
            rtf,
            epub,
            xls,
            xlsb,
            gzip,
            tar,
            pdf,
