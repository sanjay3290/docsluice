name: Fuzz (nightly)

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }} (30m)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            zip,
            image,
            xml,
            detect,
            detection,
            ole,
            txt,
            markdown,
            csv,
            json,
            text-families,
            xml-reader,
            html,
            doc,
            ooxml,
            docx,
            xlsx,
            xlsx-numfmt,
            pptx,
            zip-container,
            mime,
            eml,
            msg,
            ods,
            odp,
            odf,
            odt,
            rtf,
            epub,
            xls,
            xlsb,
            gzip,
            tar,
          ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/fuzz-run.test.mjs
      - id: fuzz
        run: node scripts/fuzz-run.mjs "${{ matrix.target }}" --seconds 1800 --memory-mb 1024 --artifacts fuzz-artifacts
      - uses: actions/upload-artifact@v7
        if: always() && steps.fuzz.outcome != 'success'
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30
