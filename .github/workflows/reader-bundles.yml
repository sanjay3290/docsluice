name: Reader bundle budgets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reader-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-bundles:
    name: Office reader budgets and lazy loading (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test scripts/test/reader-bundles.test.mjs
      - run: node scripts/check-reader-bundles.mjs
